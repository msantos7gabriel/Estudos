<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Analizador de Números</title>
  </head>
  <body>
    <header><h1>Analizador de Números</h1></header>
    <section>
      <div class="form_container">
        <div class="input_container">
          <label for="txtnumber">Número (entre 1 e 100 ):</label>
          <input type="number" name="txtnumber" id="txtnumber" />
          <input id="adicionar" type="button" value="Adicionar" />
        </div>
      </div>

      <div id="anwser_container">
        <select name="lista_numeros" id="lista_numeros" size="6"></select>
      </div>
      <input id="finalizar" type="button" value="finalizar" />
      <div id="resultado"></div>
    </section>
    <footer><p>® Curso Em Vídeo</p></footer>
    <script src="script.js"></script>
  </body>
</html>
